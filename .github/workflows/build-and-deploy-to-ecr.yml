name: Build and Push to ECR

on:
  push:
    branches:
      - feat/spike
      - main
  workflow_dispatch: # Allows manual triggering

permissions:
  id-token: write # This is required for OIDC
  contents: read # This is required for actions/checkout

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: plasmic-wab

jobs:
  build-and-push:
    runs-on: ubuntu-latest # This is AMD64
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-uri: ${{ steps.meta.outputs.image-uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.AWS_ROLE }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set build metadata
        id: meta
        run: |
          echo "image-tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "image-uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image (AMD64)
        id: build-amd64
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/wab/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image-tag }}-amd64
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (ARM64)
        id: build-arm64
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: ./platform
          file: ./platform/wab/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image-tag }}-arm64
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push multi-platform manifest
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG=${{ steps.meta.outputs.image-tag }}
          
          # Build the platform list based on what succeeded
          PLATFORMS=""
          
          # AMD64 should always succeed (no continue-on-error)
          PLATFORMS="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-amd64"
          
          # Check if ARM64 build succeeded
          if [ "${{ steps.build-arm64.outcome }}" == "success" ]; then
            PLATFORMS="$PLATFORMS $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-arm64"
            echo "✅ Including ARM64 in manifest"
          else
            echo "⚠️  ARM64 build failed, creating AMD64-only manifest"
          fi
          
          # Create multi-platform manifests
          docker manifest create $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $PLATFORMS
          docker manifest push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          docker manifest create --amend $ECR_REGISTRY/$ECR_REPOSITORY:latest $PLATFORMS
          docker manifest push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "✅ Manifest created and pushed with platforms: $PLATFORMS"

  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # This requires manual approval
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.AWS_ROLE }}
          role-session-name: GitHubActions-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          echo "🚀 Deploying image: ${{ needs.build-and-push.outputs.image-uri }}"

          aws ecs update-service \
            --cluster plasmic-test-cluster \
            --service plasmic-wab-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "⏳ Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster plasmic-test-cluster \
            --services plasmic-wab-service \
            --region ${{ env.AWS_REGION }}

          echo "✅ Deployment complete!"
