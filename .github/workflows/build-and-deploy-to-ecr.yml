name: Build and Push to ECR

on:
  push:
    branches:
      - feat/spike
      - main
  workflow_dispatch: # Allows manual triggering

permissions:
  id-token: write # This is required for OIDC
  contents: read # This is required for actions/checkout

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: plasmic-wab

jobs:
  build-and-push:
    runs-on: ubuntu-latest # This is AMD64
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-uri: ${{ steps.meta.outputs.image-uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Modify Dockerfile for optimized yarn builds
        run: |
          # Create a modified Dockerfile that adds yarn config before each yarn install
          cp platform/wab/Dockerfile platform/wab/Dockerfile.modified
          
          # Add yarn config after each FROM statement
          sed -i '/^FROM node:24-alpine AS builder$/a\
RUN yarn config set network-timeout 300000 && yarn config set network-concurrency 2 && yarn config set registry https://registry.npmjs.org' platform/wab/Dockerfile.modified
          
          sed -i '/^FROM node:24-alpine AS runner$/a\
RUN yarn config set network-timeout 300000 && yarn config set network-concurrency 2 && yarn config set registry https://registry.npmjs.org' platform/wab/Dockerfile.modified
          
          echo "✅ Modified Dockerfile for optimized builds"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.AWS_ROLE }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set build metadata
        id: meta
        run: |
          echo "image-tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "image-uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image (AMD64)
        id: build-amd64
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/wab/Dockerfile.modified
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image-tag }}-amd64
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (ARM64)
        id: build-arm64
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: ./platform
          file: ./platform/wab/Dockerfile.modified
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image-tag }}-arm64
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push multi-platform manifest
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG=${{ steps.meta.outputs.image-tag }}
          
          # Check if ARM64 build succeeded
          if [ "${{ steps.build-arm64.outcome }}" == "success" ]; then
            echo "✅ Both platforms built successfully, creating multi-platform manifest"
            
            # Since docker/build-push-action creates manifest lists even for single platform,
            # we need to create a new manifest that combines them
            docker buildx imagetools create \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-amd64 \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-arm64
              
            docker buildx imagetools create \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest-amd64 \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest-arm64
          else
            echo "⚠️  ARM64 build failed, creating AMD64-only tags"
            
            # Just tag the AMD64 version as the main tags
            docker buildx imagetools create \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-amd64
              
            docker buildx imagetools create \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest-amd64
          fi
          
          echo "✅ Multi-platform tags created successfully"

  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # This requires manual approval
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.AWS_ROLE }}
          role-session-name: GitHubActions-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          echo "🚀 Deploying image: ${{ needs.build-and-push.outputs.image-uri }}"

          aws ecs update-service \
            --cluster plasmic-test-cluster \
            --service plasmic-wab-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "⏳ Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster plasmic-test-cluster \
            --services plasmic-wab-service \
            --region ${{ env.AWS_REGION }}

          echo "✅ Deployment complete!"
