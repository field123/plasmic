name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Docker image tag to deploy (leave empty for latest)'
        required: false
        default: 'latest'
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: plasmic-wab

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get full image URI
        id: image
        run: |
          REGISTRY=$(aws ecr describe-repositories --repository-names $ECR_REPOSITORY --query 'repositories[0].repositoryUri' --output text | cut -d'/' -f1)
          echo "uri=$REGISTRY/$ECR_REPOSITORY:${{ github.event.inputs.image-tag }}" >> $GITHUB_OUTPUT
      
      - name: Deploy to ECS
        run: |
          echo "🚀 Deploying image: ${{ steps.image.outputs.uri }}"
          echo "📍 Environment: ${{ github.event.inputs.environment }}"
          
          # Update service
          aws ecs update-service \
            --cluster plasmic-test-cluster \
            --service plasmic-wab-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          echo "⏳ Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster plasmic-test-cluster \
            --services plasmic-wab-service \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Deployment complete!"
      
      - name: Get deployment info
        run: |
          echo "📊 Deployment Summary:"
          aws ecs describe-services \
            --cluster plasmic-test-cluster \
            --services plasmic-wab-service \
            --query 'services[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount,Deployments:deployments[*].{Status:status,TaskDef:taskDefinition,RunningCount:runningCount}}' \
            --output table