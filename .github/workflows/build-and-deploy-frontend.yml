name: Build and Deploy Frontend

on:
  push:
    branches:
      - feat/spike
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: plasmic-frontend-${{ github.event.inputs.environment || 'staging' }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  REACT_APP_DEFAULT_HOST_URL: https://host.plasmicdev.rcf.dev/static/host.html

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: platform/wab/yarn.lock

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.AWS_ROLE }}
          role-session-name: GitHubActions-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CloudFront URL
        id: get-cf-url
        run: |
          # Get CloudFront distribution domain name
          CF_DOMAIN=$(aws cloudfront get-distribution --id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' --output text)
          echo "cloudfront-url=https://${CF_DOMAIN}" >> $GITHUB_OUTPUT

      - name: Install root dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Setup monorepo packages
        run: |
          echo "Setting up all packages..."
          yarn setup
          yarn setup:canvas-packages
          echo "✅ Setup complete"

      - name: Install wab dependencies
        working-directory: platform/wab
        run: |
          yarn install --frozen-lockfile
          # Install missing raw-loader
          yarn add --dev raw-loader

      - name: Generate required files
        working-directory: platform/wab
        run: |
          echo "Generating model classes and parsers..."
          make
          echo "✅ Generated required files"

      - name: Build CSS files
        working-directory: platform/wab
        run: |
          echo "Building CSS files..."
          yarn build-css
          echo "✅ CSS files built"

      - name: Patch rsbuild.config.ts to remove optional vars
        working-directory: platform/wab
        run: |
          # Create a backup
          cp rsbuild.config.ts rsbuild.config.ts.backup

          # Use Node.js to patch the file
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('rsbuild.config.ts', 'utf8');
            
            // Remove the OPTIONAL_VAR lines
            content = content.replace(/AMPLITUDE_API_KEY: OPTIONAL_VAR,\\n/g, '');
            content = content.replace(/INTERCOM_APP_ID: OPTIONAL_VAR,\\n/g, '');
            content = content.replace(/POSTHOG_API_KEY: OPTIONAL_VAR,\\n/g, '');
            content = content.replace(/POSTHOG_HOST: OPTIONAL_VAR,\\n/g, '');
            content = content.replace(/POSTHOG_REVERSE_PROXY_HOST: OPTIONAL_VAR,\\n/g, '');
            content = content.replace(/SENTRY_DSN: OPTIONAL_VAR,\\n/g, '');
            content = content.replace(/SENTRY_ORG_ID: OPTIONAL_VAR,\\n/g, '');
            content = content.replace(/SENTRY_PROJECT_ID: OPTIONAL_VAR,\\n/g, '');
            content = content.replace(/STRIPE_PUBLISHABLE_KEY: OPTIONAL_VAR,\\n/g, '');
            
            fs.writeFileSync('rsbuild.config.ts', content);
            console.log('✅ Patched rsbuild.config.ts to remove optional environment variables');
          "

      - name: Build frontend
        working-directory: platform/wab
        env:
          NODE_ENV: production
          PUBLIC_URL: ${{ steps.get-cf-url.outputs.cloudfront-url }}
          REACT_APP_DEFAULT_HOST: https://plasmic-test-alb-59233773.eu-west-1.elb.amazonaws.com
        run: |
          yarn build
          echo "✅ Frontend built successfully"
          ls -la build/

      - name: Deploy to S3
        working-directory: platform/wab
        run: |
          # Sync all assets with cache headers
          aws s3 sync build/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.map" \
            --exclude "static/js/*.js" \
            --exclude "static/css/*.css"

          # Upload JS and CSS with specific cache headers
          aws s3 sync build/static/js s3://${{ env.S3_BUCKET }}/static/js \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/javascript"

          aws s3 sync build/static/css s3://${{ env.S3_BUCKET }}/static/css \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/css"

          # Upload index.html with no-cache
          aws s3 cp build/index.html s3://${{ env.S3_BUCKET }}/ \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

          echo "✅ Deployed to S3"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/*"
          echo "✅ CloudFront invalidation created"

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend URL**: ${{ steps.get-cf-url.outputs.cloudfront-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API**: https://plasmic-test-alb-59233773.eu-west-1.elb.amazonaws.com" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ env.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_STEP_SUMMARY
